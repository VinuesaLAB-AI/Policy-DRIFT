# Reward predictor for Terminal Reward Guidance, trained on unguided rollouts of the frozen CFM model.
output_dir: flow_matching_trg/outputs/trg
cfm_checkpoint: checkpoints/cfm/velocity_model.pt
T: 25
n_euler_steps: 50
hidden_channels: 64
alpha: 1.0
training:
  batch_size: 24
  num_workers: 4
  max_epochs: 500
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  val_every_n_epochs: 5
  early_stopping_patience: 50
  seed: 42
